apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pdf-to-podcast.fullname" . }}-credentials
  labels:
    {{- include "pdf-to-podcast.labels" . | nindent 4 }}
type: Opaque
stringData:
  NVIDIA_API_KEY: {{ .Values.secrets.nvidiaApiKey | default "" | quote }}
  ELEVENLABS_API_KEY: {{ .Values.secrets.elevenlabsApiKey | default "" | quote }}
  MINIO_ROOT_USER: {{ .Values.minio.credentials.rootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.minio.credentials.rootPassword | quote }}
