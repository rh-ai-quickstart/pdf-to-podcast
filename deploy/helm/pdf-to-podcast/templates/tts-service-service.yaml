{{- if .Values.ttsService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: tts-service
  labels:
    app: {{ .Values.ttsService.fullnameOverride }}
    {{- include "pdf-to-podcast.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Values.ttsService.fullnameOverride }}
  type: {{ include "pdf-to-podcast.serviceType" . }}
  ports:
    - port: {{ .Values.ttsService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
{{- end }}
