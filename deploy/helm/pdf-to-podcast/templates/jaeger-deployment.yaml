{{- if .Values.jaeger.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.jaeger.fullnameOverride }}-deployment
  labels:
    app: {{ .Values.jaeger.fullnameOverride }}
    {{- include "pdf-to-podcast.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.jaeger.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.jaeger.fullnameOverride }}
  template:
    metadata:
      labels:
        app: {{ .Values.jaeger.fullnameOverride }}
    spec:
      automountServiceAccountToken: false

      {{- if .Values.openshift.enabled }}
      securityContext:
        {{- include "pdf-to-podcast.podSecurityContext" . | nindent 8 }}
      {{- end }}

      containers:
        - name: jaeger
          image: "{{ .Values.jaeger.image.repository }}:{{ .Values.jaeger.image.tag }}"
          imagePullPolicy: Always

          {{- if .Values.openshift.enabled }}
          securityContext:
            {{- include "pdf-to-podcast.containerSecurityContext" . | nindent 12 }}
          {{- end }}

          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"

          ports:
            - name: ui
              containerPort: {{ .Values.jaeger.service.uiPort }}
              protocol: TCP
            - name: otlp-grpc
              containerPort: {{ .Values.jaeger.service.otlpGrpcPort }}
              protocol: TCP
            - name: otlp-http
              containerPort: {{ .Values.jaeger.service.otlpHttpPort }}
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /
              port: ui
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: ui
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            {{- toYaml .Values.jaeger.resources | nindent 12 }}
{{- end }}
